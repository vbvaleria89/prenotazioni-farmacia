  <!-- Form nativo per i password manager (Flutter web non è un <form> HTML). Off-screen, non display:none. -->

  /* farmacia-kill-sw + build-bust 2026-11-11-v50 */
  (function () {
    var BUILD = '2026-11-11-v50';
    var prev = null;
    try { prev = localStorage.getItem('farmacia_build'); } catch (e) {}
    var changed = prev !== BUILD;
    function finish() {
      try { localStorage.setItem('farmacia_build', BUILD); } catch (e) {}
      // Una sola ricarica per build nuova (mobile senza hard refresh)
      if (changed) {
        var k = 'swk_' + BUILD;
        try {
          if (!sessionStorage.getItem(k)) {
            sessionStorage.setItem(k, '1');
            location.reload();
            return;
          }
        } catch (e) {}
      }
    }
    var p = Promise.resolve();
    if ('serviceWorker' in navigator) {
      p = navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      });
    }
    p.then(function () {
      if (!window.caches) return;
      return caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      });
    }).then(finish).catch(finish);
  })();
  </script>
